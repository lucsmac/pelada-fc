databases:
  - name: peladafc-db
    plan: free
    databaseName: peladafc
    user: peladafc
    postgresMajorVersion: "16"

services:
  - type: web
    name: peladafc-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    healthCheckPath: /health
    buildCommand: |
      corepack enable
      corepack prepare pnpm@10.12.4 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @peladafc/db exec prisma generate
      pnpm --filter @peladafc/db build
      pnpm --filter @peladafc/api build
    startCommand: |
      pnpm --filter @peladafc/db exec prisma migrate deploy && node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: peladafc-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://peladafc-web.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: COOKIE_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: peladafc-web
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      corepack enable
      corepack prepare pnpm@10.12.4 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @peladafc/web... build
    startCommand: |
      pnpm --filter @peladafc/web exec next start --port $PORT --hostname 0.0.0.0
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://peladafc-api.onrender.com/v1
